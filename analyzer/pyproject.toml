[project]
name = "tempo-atlas-analyzer"
version = "0.1.0"
description = "Essentia analysis of 30-second previews, in memory only"
requires-python = ">=3.14,<3.15"
dependencies = [
  "essentia==2.1b6.dev1438",
  "fastapi>=0.120",
  "httpx>=0.28",
  "numpy>=2.3",
  "uvicorn>=0.38",
]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.uv]
package = false
